name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run release gates
        run: npm run ci
      - name: Build checksummed release artifacts
        run: |
          npm run release:artifacts
          (cd release && sha256sum --check SHA256SUMS)
      - name: Build and test container image
        run: |
          VERSION="${RELEASE_TAG#v}"
          MAJOR="${VERSION%%.*}"
          REMAINDER="${VERSION#*.}"
          MINOR="${REMAINDER%%.*}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          docker build \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --build-arg "SOURCE=${SOURCE}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${MAJOR}.${MINOR}" \
            --tag "${IMAGE}:${MAJOR}" \
            --tag "${IMAGE}:latest" \
            .

          CONTAINER_ID="$(docker run --detach --publish 127.0.0.1:3000:3000 "${IMAGE}:${VERSION}")"
          trap 'docker rm --force "${CONTAINER_ID}" >/dev/null' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              docker logs "${CONTAINER_ID}"
              exit 1
            fi
            sleep 2
          done
      - name: Publish npm package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.name)")"
          VERSION="${RELEASE_TAG#v}"
          TARBALL="release/nla-am-nla-mcp-${VERSION}.tgz"
          LOCAL_INTEGRITY="$(node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFileSync } from 'node:fs'; process.stdout.write('sha512-' + createHash('sha512').update(readFileSync(process.argv[1])).digest('base64'))" "${TARBALL}")"

          if PUBLISHED_INTEGRITY="$(npm view "${PACKAGE_NAME}@${VERSION}" dist.integrity 2>/tmp/npm-view-error.log)"; then
            if [ "${PUBLISHED_INTEGRITY}" != "${LOCAL_INTEGRITY}" ]; then
              echo "Published npm integrity does not match the tagged artifact" >&2
              exit 1
            fi
            echo "${PACKAGE_NAME}@${VERSION} is already published with matching integrity"
          elif grep --quiet 'E404' /tmp/npm-view-error.log; then
            npm publish "${TARBALL}" --access public --provenance
          else
            cat /tmp/npm-view-error.log >&2
            exit 1
          fi
      - name: Publish container image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push --all-tags "${IMAGE}"
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber
            gh release edit "${RELEASE_TAG}" --title "nla-mcp ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              release/* \
              --verify-tag \
              --generate-notes \
              --title "nla-mcp ${RELEASE_TAG}"
          fi
